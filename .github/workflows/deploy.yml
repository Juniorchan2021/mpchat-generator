name: Deploy MPChat

on:
  push:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────
  # Job 1: 构建前端并部署到 Cloudflare Pages
  # ─────────────────────────────────────────────
  deploy-frontend:
    name: Build & Deploy Frontend (Cloudflare Pages)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build Next.js (static export)
        run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_API_KEY: ${{ secrets.NEXT_PUBLIC_API_KEY }}
          NEXT_PUBLIC_DEFAULT_GEMINI_KEY: ${{ secrets.NEXT_PUBLIC_DEFAULT_GEMINI_KEY }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ secrets.CF_PAGES_PROJECT_NAME }}
          directory: frontend/out
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────
  # Job 2: SSH 到后端服务器拉取代码并重启服务
  # ─────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend (SSH)
    runs-on: ubuntu-latest
    # 仅当 SSH_HOST secret 存在时才执行后端部署
    # 若暂未配置服务器，此 Job 会跳过（secrets 为空时 SSH Action 会失败，
    # 用 if 条件保护，避免阻断整个流水线）
    if: ${{ secrets.SSH_HOST != '' }}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            # 进入项目目录（按实际路径修改）
            cd ~/mpchat-generator

            # 拉取最新代码
            git pull origin main

            # 安装/更新 Python 依赖
            pip3 install -r requirements.txt --quiet

            # 重启后端服务
            # ── 使用 systemd（推荐）：
            systemctl restart mpchat-api
            # ── 若使用 pm2，注释上行并取消下行注释：
            # pm2 reload mpchat-api --update-env
