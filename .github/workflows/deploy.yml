name: Deploy MPChat

on:
  push:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────
  # Job 1: 构建前端并部署到 Cloudflare Pages
  # ─────────────────────────────────────────────
  deploy-frontend:
    name: Build & Deploy Frontend (Cloudflare Pages)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build Next.js (static export)
        run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_API_KEY: ${{ secrets.NEXT_PUBLIC_API_KEY }}
          NEXT_PUBLIC_DEFAULT_GEMINI_KEY: ${{ secrets.NEXT_PUBLIC_DEFAULT_GEMINI_KEY }}
          NEXT_PUBLIC_DEFAULT_KIMI_KEY: ${{ secrets.NEXT_PUBLIC_DEFAULT_KIMI_KEY }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ secrets.CF_PAGES_PROJECT_NAME }}
          directory: frontend/out
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────
  # Job 2: SSH 到后端服务器拉取代码并重启服务
  # ─────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend (SSH)
    runs-on: ubuntu-latest
    # 通过 repository variable DEPLOY_BACKEND 控制是否执行后端部署
    # 在 GitHub → Settings → Variables → Actions 中设置 DEPLOY_BACKEND=true 即可启用
    if: vars.DEPLOY_BACKEND == 'true'

    env:
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: PIXABAY_API_KEY,PEXELS_API_KEY
          script: |
            set -e
            # 进入项目目录（按实际路径修改）
            cd ~/mpchat-generator

            # 拉取最新代码
            git pull origin main

            # 注入图片 API Key 到服务器 .env（若已存在则更新，否则追加）
            update_env() {
              local key="$1" val="$2"
              if grep -q "^${key}=" .env 2>/dev/null; then
                sed -i "s|^${key}=.*|${key}=${val}|" .env
              else
                echo "${key}=${val}" >> .env
              fi
            }
            update_env "PIXABAY_API_KEY" "$PIXABAY_API_KEY"
            update_env "PEXELS_API_KEY" "$PEXELS_API_KEY"

            # 安装/更新 Python 依赖
            pip3 install -r requirements.txt --quiet

            # 重启后端服务
            # ── 使用 systemd（推荐）：
            systemctl restart mpchat-api
            # ── 若使用 pm2，注释上行并取消下行注释：
            # pm2 reload mpchat-api --update-env
